[mypy]
python_version = 3.12
ignore_missing_imports = True
strict = False
warn_return_any = False
warn_unused_ignores = False
disable_error_code = assignment, arg-type, attr-defined, no-any-return, union-attr, index

[mypy-aegis_server.*]
ignore_errors = True

[mypy-integrations.*]
ignore_errors = True
