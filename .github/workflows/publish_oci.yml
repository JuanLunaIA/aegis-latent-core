name: Publish multi-architecture OCI images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify signed tag and protected-branch ancestry
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify immutable release provenance and synchronized versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          git verify-tag "${RELEASE_TAG}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python scripts/verify_release_contract.py --root .

  publish:
    name: Build, publish, and sign ${{ matrix.component }}
    needs: provenance
    if: vars.AEGIS_OCI_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment:
      name: oci-release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Derive lowercase immutable image reference
        env:
          COMPONENT: ${{ matrix.component }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          repository="${REPOSITORY,,}"
          echo "ref=ghcr.io/${repository}-${COMPONENT}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and publish exact multi-architecture manifest
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign immutable manifest digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: cosign sign --yes "${IMAGE_REF%:*}@${DIGEST}"
