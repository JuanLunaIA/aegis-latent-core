name: Validate multi-architecture OCI images

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: validate-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify signed tag and protected-branch ancestry
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify immutable release provenance and synchronized versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          git verify-tag "${RELEASE_TAG}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python scripts/verify_release_contract.py --root . --tag "${RELEASE_TAG}"

  validate-images:
    name: Build without publishing ${{ matrix.component }}
    needs: provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            context: .
            dockerfile: deploy/docker/Dockerfile
          - component: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact multi-architecture image without registry output
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: true
