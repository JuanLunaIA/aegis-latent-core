name: Publish multi-architecture OCI images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed release tag to publish"
        required: true
        type: string
      expected_target:
        description: "Full commit SHA signed by release_tag"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  EXPECTED_TAG_TARGET: ${{ inputs.expected_target }}

concurrency:
  group: publish-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify signed tag and protected-branch ancestry
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify immutable release provenance and synchronized versions
        run: |
          scripts/verify_release_tag.sh "${RELEASE_TAG}" "${EXPECTED_TAG_TARGET}"
      - name: Check out and verify the exact signed source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_TAG_TARGET }}
      - name: Verify synchronized source contract
        run: |
          python scripts/verify_release_contract.py --root . --tag "${RELEASE_TAG}"

  # The exact signed commit's gateway image must serve under its own seccomp
  # filter and the repository AppArmor profile before anything is pushed
  # (scripts/container_smoke_test.py; same job as ci.yml's container-smoke).
  gateway-smoke:
    name: Smoke-test the gateway image before publishing
    needs: provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_TAG_TARGET }}
      - name: Load the repository AppArmor profile
        run: |
          sudo apparmor_parser -r -W deploy/apparmor/aegis.profile
          sudo aa-status | grep -F aegis-latent-core
      - name: Build the gateway image
        run: docker build -f deploy/docker/Dockerfile -t aegis-latent-core:smoke .
      - name: Run the image in the hardened compose posture
        run: python3 scripts/container_smoke_test.py --image aegis-latent-core:smoke --apparmor aegis-latent-core --ha
      - name: Kernel denials (on failure)
        if: failure()
        run: sudo dmesg | grep -E 'apparmor="DENIED"|type=1326' | tail -n 100 || true

  publish-images:
    name: Publish and sign ${{ matrix.component }} OCI image
    needs: [provenance, gateway-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment:
      name: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            context: .
            dockerfile: deploy/docker/Dockerfile
            image: ghcr.io/juanlunaia/aegis-latent-core
          - component: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
            image: ghcr.io/juanlunaia/aegis-latent-core-dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_TAG_TARGET }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Derive exact immutable image tags
        id: image
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test "${RELEASE_TAG}" = "v${VERSION}"
          echo "name=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:sha-${EXPECTED_TAG_TARGET}" >> "${GITHUB_OUTPUT}"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
      - name: Attest published OCI digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign published OCI digest with keyless Sigstore
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
