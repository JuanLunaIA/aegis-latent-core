name: Publish Python SDK to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify signed tag and protected-branch ancestry
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify immutable release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          scripts/verify_release_tag.sh "${RELEASE_TAG}" "${GITHUB_SHA}"

  build:
    name: Build and verify Python SDK
    needs: provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Verify release tag matches Python SDK version
        working-directory: sdk/python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match Python SDK v{version}")
          PY
      - name: Install locked build backend and SDK test toolchain
        run: python -m pip install build==1.3.0 twine==6.2.0 "./sdk/python[dev]"
      - name: Lint, typecheck, and test Python SDK
        working-directory: sdk/python
        run: |
          ruff check src tests
          mypy --config-file pyproject.toml
          pytest -q
      - name: Build and verify Python SDK distributions
        working-directory: sdk/python
        run: |
          python -m build
          twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Upload immutable Python SDK distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-dist-${{ github.sha }}
          path: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified Python SDK artifact
    needs: build
    if: vars.AEGIS_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aegis-latent-sdk/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact Python SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-sdk-dist-${{ github.sha }}
          path: release-artifact
      - name: Publish to PyPI with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifact
          print-hash: true
          verbose: true
          attestations: true
          skip-existing: false
