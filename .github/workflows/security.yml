#
# security.yml — Scheduled and on-demand deep security scanning.
#
# Runs weekly and on every push to main. Results are uploaded to GitHub
# Security (SARIF) so findings appear in the Security → Code Scanning tab.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan — Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  # ── CodeQL static analysis ───────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    # Findings and analysis failures are release-relevant; this job is blocking.
    strategy:
      fail-fast: false
      matrix:
        language: [python]
        # Add rust once CodeQL has stable Rust support
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:${{ matrix.language }}

  # ── Bandit SAST (SARIF output) ───────────────────────────────────────────
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit with SARIF support
        run: pip install "bandit[sarif]"

      - name: Run bandit
        run: |
          bandit -r aegis/ aegis_server/ \
            -c pyproject.toml \
            -f sarif \
            -o bandit.sarif \
            --exit-zero
          # Still fail on high severity
          bandit -r aegis/ aegis_server/ -c pyproject.toml -lll

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── pip-audit dependency vulnerability scan ──────────────────────────────
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Floor build tooling (CVE-2024-6345 / CVE-2026-24049)
        run: |
          python -m pip install --upgrade \
            "pip>=26.1" \
            "setuptools>=78.1.1" \
            "wheel>=0.46.2"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies (pinned requirements)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Audit resolved/installed environment
        # No -r: audits the full installed closure (runtime + dev + build tooling)
        # so vulnerable resolved versions are caught even when requirements.txt
        # is clean. Fails the job on any known advisory.
        run: |
          pip install -e ".[dev]"
          pip-audit --progress-spinner off

  # ── Trivy container vulnerability scan ──────────────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scan filesystem (no Docker build needed)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"   # block HIGH/CRITICAL findings
          # Trivy does NOT read aegis_rust_v2/.cargo/audit.toml, so the
          # owner-accepted, documented Rust advisories (hickory-proto) are
          # mirrored in the repo-root .trivyignore. Keep the two lists in sync.
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── OSV-Scanner (cross-ecosystem lockfile vulnerability scan) ────────────
  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run OSV-Scanner over Python lockfile
        # Scans the committed requirements.txt against the OSV database.
        # (Rust crates are covered by the dedicated cargo-audit job below,
        # which reads the now-committed Cargo.lock with documented ignores.)
        # Findings are release-relevant and block the PR.
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=requirements.txt
            --format=sarif
            --output=osv-results.sarif

      - name: Upload OSV SARIF
        # Only upload when the scanner actually produced a report.
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ── Cargo audit (Rust dependency security) ──────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Audit Rust dependencies
        working-directory: aegis_rust_v2
        run: |
          # RUSTSEC-2026-0176 / -0177 (pyo3 0.24.x) were cleared by the pyo3
          # 0.29.0 upgrade and are deliberately no longer ignored.
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0162 \
            --ignore RUSTSEC-2026-0163 \
            --ignore RUSTSEC-2026-0166
