name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always
  # Prevent seccomp filter from interfering with CI runners
  HERMES_SANDBOX: "true"

# Workflow-wide floor for GITHUB_TOKEN. Without it, every job here inherits the
# repository default, which may be read/write across all scopes. The two jobs
# that genuinely need to write (sbom: attestations; docker: packages) declare
# their own block, and a job-level block replaces this one rather than adding
# to it — so raising a job's privilege stays an explicit, reviewable act.
permissions:
  contents: read

jobs:
  # ── License headers ──────────────────────────────────────────────────────────
  license-check:
    name: License Headers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify AGPLv3 / Commercial headers
        run: |
          python scripts/apply_license_headers.py
          if ! git diff --quiet; then
            echo "::error::Missing or outdated license headers. Run: python scripts/apply_license_headers.py"
            git diff --stat
            exit 1
          fi
      - name: Verify GitHub Actions SHA pinning
        run: python scripts/verify_github_action_pins.py

  # ── Formal verification ───────────────────────────────────────────────────
  formal-verification:
    name: Formal Verification (Z3, Lean, TLC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned formal toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ant z3
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          TLA_REVISION=0894c3407f4717fec7cc18bde3bf3c857fa47333
          rm -rf /tmp/tlaplus-src
          git init -q /tmp/tlaplus-src
          git -C /tmp/tlaplus-src remote add origin https://github.com/tlaplus/tlaplus.git
          git -C /tmp/tlaplus-src fetch --depth 1 origin "$TLA_REVISION"
          git -C /tmp/tlaplus-src checkout --detach FETCH_HEAD
          test "$(git -C /tmp/tlaplus-src rev-parse HEAD)" = "$TLA_REVISION"
          ant -f /tmp/tlaplus-src/tlatools/org.lamport.tlatools/customBuild.xml \
            -Dgit.branch=detached \
            -Dgit.tag= \
            -Dgit.revision="$TLA_REVISION" \
            -Dgit.shortRevision="${TLA_REVISION:0:7}" \
            -Dgit.commitsCount=unknown \
            compile compile-test dist
          mkdir -p .tools
          cp /tmp/tlaplus-src/tlatools/org.lamport.tlatools/dist/tla2tools.jar \
            .tools/tla2tools.jar
          unzip -p .tools/tla2tools.jar META-INF/MANIFEST.MF \
            | grep -F "X-Git-Revision: $TLA_REVISION"
      - name: Check bounded safety models
        run: scripts/verify_formal_artifacts.sh

  # ── Documentation gates ───────────────────────────────────────────────────
  docs:
    name: Documentation Gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Four checkers with distinct jobs; see docs/DOCUMENTATION_GOVERNANCE.md.
      # None supersedes another, so all four run and all four must pass.
      - name: Required corpus, links, placeholders, prohibited phrasing
        run: python scripts/verify_docs.py --root .
      - name: Claims register coherence and reference integrity
        run: python scripts/verify_claims.py --root .
      - name: Relative links and heading anchors
        run: bash scripts/verify_links.sh --root .
      - name: Prose boundary language
        run: python tools/docs/verify_documentation.py --root . --strict
      - name: Whitespace
        run: git diff --check

  # ── Lint & format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: |
          ruff check \
            aegis \
            aegis_server \
            integrations \
            tests \
            tools/visualizer \
            tools/forensic \
            tools/benchmarks \
            tools/security \
            benchmarks
      - name: Ruff format check
        run: |
          ruff format --check \
            aegis \
            aegis_server \
            integrations \
            tests \
            tools/visualizer \
            tools/forensic \
            tools/benchmarks \
            tools/security \
            benchmarks

  # ── Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + mypy
        run: pip install -e ".[dev]"
      - name: Mypy (CI profile — proxy + core runtime)
        run: |
          mypy --config-file=mypy-ci.ini \
            aegis/config.py \
            aegis/auth/apikey.py \
            aegis/auth/principal.py \
            aegis/auth/oidc.py \
            aegis/auth/mtls.py \
            aegis/anchoring/rfc3161.py \
            aegis/core/mmr.py \
            aegis/core/crypto_audit.py \
            aegis/core/forensic.py \
            aegis/core/ratelimiter.py \
            aegis/core/normalization.py \
            aegis/core/session_manager.py \
            aegis/core/moe_monitor.py \
            aegis/core/leak_detector.py \
            aegis/core/seccomp_guard.py \
            aegis/core/lsm_guard.py \
            aegis/core/math_utils.py \
            aegis/core/telemetry.py \
            aegis/proxy/waf.py \
            aegis/proxy/schemas.py \
            aegis/proxy/forwarder.py \
            aegis/proxy/streaming.py \
            aegis/proxy/audit_api.py \
            aegis/proxy/dependencies.py \
            aegis/proxy/rate_limiter.py \
            aegis/storage/s3_worm.py \
            aegis/storage/segment_manifest.py \
            aegis/telemetry/events.py \
            aegis/telemetry/otel.py \
            aegis/telemetry/siem.py
      # The strict profile now passes over the whole package. It is a separate
      # step so a regression names itself rather than hiding inside the CI
      # profile above, which stays as the narrower always-green floor. The
      # Python SDK is checked strictly in the sdk-python job, which installs
      # its own pinned dependencies.
      - name: Mypy (strict — whole aegis package)
        run: mypy --strict aegis

  # ── Public SDK contract gates ───────────────────────────────────────────────
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SDK and test toolchain
        run: pip install -e "./sdk/python[dev]" build==1.3.0
      - name: Lint, typecheck, and test official-client compatibility
        working-directory: sdk/python
        run: |
          ruff check src tests
          mypy --config-file pyproject.toml
          mypy --strict src
          pytest -q
      - name: Build standalone SDK distribution
        run: python -m build sdk/python

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install locked dependencies
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts
      - name: Typecheck, cross-language vectors, build, and audit
        working-directory: sdk/typescript
        run: |
          npm run check
          npm audit --audit-level=high
          npm pack --dry-run

  dashboard:
    name: Audit Dashboard
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AEGIS_PRIMARY_BASE_URL: "http://127.0.0.1:8000"
      AEGIS_DASHBOARD_API_KEY: "ci-build-placeholder"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            dashboard/package-lock.json
      - name: Build local TypeScript verifier package
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: Typecheck, accessibility tests, production build, and audit
        working-directory: dashboard
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high

      # The build above ran with AEGIS_DASHBOARD_API_KEY set, so that value is
      # a canary: if any inlining path put it into browser-served output, it is
      # sitting in .next/static or a prerendered payload right now. Exit 2 means
      # the check could not run (no build output, no value) and also fails.
      - name: Assert no server-only secret reached the client bundle
        working-directory: dashboard
        run: npm run check:bundle-secrets

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # CI executes isolated tests; production defaults remain strict in the application.
      AEGIS_SECURITY_ENFORCEMENT_MODE: development
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"
      - name: Run test suite with coverage gate
        run: |
          python -X faulthandler -m pytest tests/ -v \
            -o faulthandler_timeout=60 \
            --cov=aegis \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65
      - name: Dependency audit (runtime manifest)
        run: |
          set +e
          timeout 120s python -m pip_audit -r requirements.txt \
            --progress-spinner off --timeout 30 > /tmp/pip-audit.log 2>&1
          audit_status=$?
          set -e
          cat /tmp/pip-audit.log
          if grep -Eq '^Found [1-9][0-9]* known vulnerabilit' /tmp/pip-audit.log; then
            exit 1
          fi
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::pip-audit operational failure; retrying once after 5 seconds"
            sleep 5
            timeout 120s python -m pip_audit -r requirements.txt \
              --progress-spinner off --timeout 30
          fi
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Market hardening harnesses ─────────────────────────────────────────────
  market-hardening:
    name: Market Hardening Gates
    runs-on: ubuntu-22.04
    needs: [test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Run pinned WAF corpus
        run: |
          python tools/security/run_waf_corpus.py --output /tmp/aegis-waf-report.json
      - name: Run WAL backpressure fault injection
        run: |
          python tools/benchmarks/run_backpressure_stall.py \
            --duration-s 0.25 --offered-rps 10000 --fsync-delay-ms 2 --max-workers 64 \
            --output /tmp/aegis-backpressure-report.json
      - name: Run local three-instance key rotation exercise
        run: |
          python tools/benchmarks/run_key_rotation.py \
            --duration-s 0.5 --output /tmp/aegis-key-rotation-report.json
      - name: Assert machine-readable gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = [
              Path('/tmp/aegis-waf-report.json'),
              Path('/tmp/aegis-backpressure-report.json'),
              Path('/tmp/aegis-key-rotation-report.json'),
          ]
          failed = []
          for path in reports:
              report = json.loads(path.read_text(encoding='utf-8'))
              if report.get('gate', {}).get('passed') is not True:
                  failed.append(str(path))
          if failed:
              raise SystemExit(f'failed market-hardening gates: {failed}')
          print('market-hardening gates passed:', ', '.join(str(path) for path in reports))
          PY
      - name: Upload market-hardening artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: market-hardening-reports
          path: /tmp/aegis-*-report.json

  # ── Rust extension ────────────────────────────────────────────────────────
  rust:
    name: Rust Extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install maturin
        run: pip install maturin
      - name: Cargo test
        working-directory: aegis_rust_v2
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo test --release
      - name: Clippy (all targets and features)
        working-directory: aegis_rust_v2
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build Python wheel (smoke check)
        working-directory: aegis_rust_v2
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: maturin build --release --features extension-module

  # ── Model checking ────────────────────────────────────────────────────────
  # Bit-level proofs over the WAL's frame-bounds arithmetic. Scope and limits:
  # docs/formal/FORMAL_VERIFICATION_LIMITS.md.
  #
  # Kept out of the `rust` job because `cargo kani setup` downloads its own
  # nightly toolchain and CBMC bundle, which would slow every Rust run. It is
  # also deliberately absent from the `docker` job's `needs`: that download is a
  # network dependency this repository does not control, and a release should
  # not become unshippable because a third-party bundle host is unavailable.
  # The proofs therefore run as a PR check, not as a release gate.
  kani:
    name: Kani Model Checking
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Kani builds the whole crate, so pyo3's build script runs and refuses any
      # interpreter below the `abi3-py311` floor. ubuntu-22.04 ships Python 3.10,
      # which fails with "cannot set a minimum Python version 3.11 higher than
      # the interpreter version 3.10". Unlike the `rust` job,
      # PYO3_USE_ABI3_FORWARD_COMPATIBILITY does not help — it was verified not
      # to change that error — so an interpreter at or above the floor is the
      # requirement, and this step is what supplies it.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned Kani
        run: |
          set -euo pipefail
          cargo install --locked --version 0.67.0 kani-verifier
          cargo kani setup
          cargo kani --version
      - name: Verify WAL frame-bounds proofs
        working-directory: aegis_rust_v2
        run: cargo kani

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Floor build tooling (CVE-2024-6345 / CVE-2026-24049)
        run: |
          python -m pip install --upgrade \
            "pip>=26.1" \
            "setuptools>=78.1.1" \
            "wheel>=0.46.2"
      - name: Install package and scanners
        run: |
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Bandit SAST
        run: bandit -r aegis/ aegis_server/ -c pyproject.toml -lll
      - name: Dependency audit (pinned requirements)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Dependency audit (resolved/installed environment)
        # Audits what is actually installed (transitive closure + build tooling),
        # not just the pinned requirements.txt. This catches vulnerable resolved
        # versions that a clean requirements.txt would otherwise hide.
        run: pip-audit --progress-spinner off

  # ── Lock file integrity ───────────────────────────────────────────────────
  lock-file-check:
    name: Lock File Integrity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install compatible lock tooling
        # pip-tools 7.5.2 imports an internal API removed by pip 25.3.
        run: python -m pip install pip==25.2 pip-tools==7.5.2
      - name: Regenerate lock file
        run: |
          # Seed the output with the reviewed lock so compatible transitive
          # releases appearing on PyPI do not create time-dependent CI drift.
          # pip-compile still updates entries that conflict with requirements.txt.
          cp requirements.lock requirements.lock.new
          pip-compile --generate-hashes --output-file=requirements.lock.new requirements.txt
      - name: Check for drift
        run: |
          # Normalize the autogenerated header comment (which embeds --output-file=...)
          # before diffing so the only meaningful diff is package/version/hash changes.
          sed 's|--output-file=requirements\.lock\.new|--output-file=requirements.lock|g' \
            requirements.lock.new > requirements.lock.normalized
          if ! diff -q requirements.lock requirements.lock.normalized > /dev/null 2>&1; then
            echo "::error::requirements.lock is out of date. Regenerate with:"
            echo "::error::  pip-compile --generate-hashes --output-file=requirements.lock requirements.txt"
            diff requirements.lock requirements.lock.normalized || true
            exit 1
          fi

  # ── Helm lint ─────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.4
      - run: helm lint deploy/helm/

  # ── SBOM and attestation (main + release) ─────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, security, market-hardening]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build source artifact
        run: |
          set -euo pipefail
          mkdir sbom-root
          git archive --format=tar.gz --output="aegis-source-${GITHUB_SHA}.tar.gz" HEAD
          tar -xzf "aegis-source-${GITHUB_SHA}.tar.gz" -C sbom-root
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sbom-root
          format: spdx-json
          output-file: sbom.spdx.json
          # `anchore/sbom-action` defaults this to true, so on a
          # `release: published` event it tried to attach an SBOM to the
          # release and failed with "Resource not accessible by integration"
          # against this job's `contents: read`.
          #
          # Raising the scope to `contents: write` would silence the error but
          # publish an asset that `release.yml` did not produce: not listed in
          # `release-asset-manifest.json` and not hashed in `SHA256SUMS`. The
          # documented way to verify a release asset is to download the bytes
          # and check them against `SHA256SUMS`, so an unmanifested asset is a
          # hole in that instruction, not a convenience.
          #
          # `release.yml` is the single owner of release assets, and it emits
          # its own canonical `aegis-latent-core-<version>.spdx.json` with a
          # sidecar. This job's product is the workflow artifact plus the
          # attestation below, which is why the upload is off and the token
          # stays read-only.
          upload-release-assets: false
      - name: Attest source SBOM
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: aegis-source-${{ github.sha }}.tar.gz
          sbom-path: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            aegis-source-${{ github.sha }}.tar.gz
            sbom.spdx.json

  # ── Docker build & push (main + release) ──────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-22.04
    needs: [lint, typecheck, test, security, rust, helm-lint, market-hardening]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless Sigstore)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_REF}"
