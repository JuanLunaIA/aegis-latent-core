name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always
  # Prevent seccomp filter from interfering with CI runners
  HERMES_SANDBOX: "true"

jobs:
  # ── License headers ──────────────────────────────────────────────────────────
  license-check:
    name: License Headers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify AGPLv3 / Commercial headers
        run: |
          python scripts/apply_license_headers.py
          if ! git diff --quiet; then
            echo "::error::Missing or outdated license headers. Run: python scripts/apply_license_headers.py"
            git diff --stat
            exit 1
          fi

  # ── Lint & format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: |
          ruff check \
            aegis \
            aegis_server \
            integrations \
            tests \
            tools/visualizer \
            benchmarks
      - name: Ruff format check
        run: |
          ruff format --check \
            aegis \
            aegis_server \
            integrations \
            tests \
            tools/visualizer \
            benchmarks

  # ── Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package + mypy
        run: pip install -e ".[dev]"
      - name: Mypy (CI profile — proxy + core runtime)
        run: |
          mypy --config-file=mypy-ci.ini \
            aegis/config.py \
            aegis/auth/apikey.py \
            aegis/core/mmr.py \
            aegis/core/crypto_audit.py \
            aegis/core/forensic.py \
            aegis/core/ratelimiter.py \
            aegis/core/normalization.py \
            aegis/core/session_manager.py \
            aegis/core/moe_monitor.py \
            aegis/core/leak_detector.py \
            aegis/core/seccomp_guard.py \
            aegis/core/lsm_guard.py \
            aegis/core/math_utils.py \
            aegis/core/telemetry.py \
            aegis/proxy/waf.py \
            aegis/proxy/schemas.py \
            aegis/proxy/forwarder.py

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (editable) with dev extras
        run: pip install -e ".[dev]"
      - name: Run test suite with coverage gate
        run: |
          pytest tests/ -v \
            --cov=aegis \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Rust extension ────────────────────────────────────────────────────────
  rust:
    name: Rust Extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install maturin
        run: pip install maturin
      - name: Cargo test
        working-directory: aegis_rust_v2
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo test --release
      - name: Build Python wheel (smoke check)
        working-directory: aegis_rust_v2
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: maturin build --release --features extension-module

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Floor build tooling (CVE-2024-6345 / CVE-2026-24049)
        run: |
          python -m pip install --upgrade \
            "pip>=26.1" \
            "setuptools>=78.1.1" \
            "wheel>=0.46.2"
      - name: Install package and scanners
        run: |
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Bandit SAST
        run: bandit -r aegis/ aegis_server/ -c pyproject.toml -lll
      - name: Dependency audit (pinned requirements)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Dependency audit (resolved/installed environment)
        # Audits what is actually installed (transitive closure + build tooling),
        # not just the pinned requirements.txt. This catches vulnerable resolved
        # versions that a clean requirements.txt would otherwise hide.
        run: pip-audit --progress-spinner off

  # ── Lock file integrity ───────────────────────────────────────────────────
  lock-file-check:
    name: Lock File Integrity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Regenerate lock file
        run: pip-compile --generate-hashes --output-file=requirements.lock.new requirements.txt
      - name: Check for drift
        run: |
          # Normalize the autogenerated header comment (which embeds --output-file=...)
          # before diffing so the only meaningful diff is package/version/hash changes.
          sed 's|--output-file=requirements\.lock\.new|--output-file=requirements.lock|g' \
            requirements.lock.new > requirements.lock.normalized
          if ! diff -q requirements.lock requirements.lock.normalized > /dev/null 2>&1; then
            echo "::error::requirements.lock is out of date. Regenerate with:"
            echo "::error::  pip-compile --generate-hashes --output-file=requirements.lock requirements.txt"
            diff requirements.lock requirements.lock.normalized || true
            exit 1
          fi

  # ── Helm lint ─────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.4
      - run: helm lint deploy/helm/

  # ── SBOM (release only) ───────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ── Docker build & push (main + release) ──────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-22.04
    needs: [lint, typecheck, test, security, rust, helm-lint]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless Sigstore)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_REF}"
