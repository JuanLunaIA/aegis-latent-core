#
# release.yml — Full release pipeline triggered on "v*" tag pushes.
#
# Flow:
#   1. Build multi-platform Python wheels (manylinux, macOS, Windows)
#   2. Build Rust extension wheels for each platform via maturin
#   3. Generate SHA-256 hashes for all artifacts
#   4. Create GitHub Release with CHANGELOG excerpt and all artifacts
#   5. Attest artifacts with GitHub's artifact attestation (SLSA Level 2)
name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  PYTHON_BUILD_VERSION: "3.12"
  CARGO_TERM_COLOR: always

jobs:
  # ── Validate the tag matches pyproject.toml version ─────────────────────
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify annotated signed tag and protected-branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          git verify-tag "${RELEASE_TAG}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Verify full release contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify_release_contract.py --root . --tag "${RELEASE_TAG}"

      - name: Extract version from pyproject.toml
        id: ver
        run: |
          VERSION=$(python -c "
          import re, sys
          txt = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*[\"\']([\d.]+)[\"\']', txt, re.M)
          if not m:
              sys.exit('version not found in pyproject.toml')
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

  # ── Pure-Python sdist + wheel (platform-independent) ────────────────────
  build-python:
    name: Build Python package
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_BUILD_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build==1.3.0 twine==6.2.0

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      - name: Generate SHA-256 hashes
        run: |
          cd dist
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/

  # ── Rust extension wheels (deterministic cross-platform matrix) ─────────
  # One abi3 (cp311-abi3) wheel per platform target covers every supported
  # CPython >= 3.11, so there is no Python-version axis. PyO3/maturin-action
  # builds glibc wheels inside pinned manylinux2014 containers and musl wheels
  # inside musllinux_1_2 containers (reproducible toolchains), cross-compiling
  # aarch64/armv7 via the action's bundled cross/zig support. macOS and Windows
  # build natively on their respective hosted runners.
  #
  #   Linux  glibc  : x86_64, aarch64            (manylinux2014)
  #   Linux  musl   : x86_64, aarch64, armv7     (musllinux_1_2 — edge / OT / IL5)
  #   macOS         : x86_64 (Intel), arm64 (Apple Silicon)
  #   Windows       : x86_64 (MSVC)
  build-rust:
    name: Rust wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    needs: validate
    strategy:
      # Never let one target's failure cancel the others — every platform
      # must build independently for a complete release.
      fail-fast: false
      matrix:
        platform:
          # ── Linux glibc (manylinux2014) ──
          - { runner: ubuntu-22.04,  target: x86_64-unknown-linux-gnu,        manylinux: "2014" }
          # aarch64-unknown-linux-gnu is deliberately not published here:
          # pqcrypto-internals v0.2.11 emits armv8.2-a+sha3, which the available
          # cross toolchains reject. Do not ship an unverified glibc wheel.
          # ── Linux musl (static — air-gapped / edge / industrial) ──
          - { runner: ubuntu-22.04,  target: x86_64-unknown-linux-musl,       manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04,  target: aarch64-unknown-linux-musl,      manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04,  target: armv7-unknown-linux-musleabihf,  manylinux: musllinux_1_2 }
          # ── macOS (native) ──
          # macos-14 is the available hosted runner; x86_64 is cross-compiled
          # with the macOS SDK instead of waiting on the retired macos-13 label.
          - { runner: macos-14,      target: x86_64-apple-darwin }
          - { runner: macos-14,      target: aarch64-apple-darwin }
          # ── Windows (native, MSVC) ──
          - { runner: windows-2022,  target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_BUILD_VERSION }}

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          # Allow building an abi3-py311 wheel against a newer interpreter.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          working-directory: aegis_rust_v2
          target: ${{ matrix.platform.target }}
          # `auto` is a no-op on macOS/Windows; the container image is only
          # consulted for the Linux targets above.
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env CFLAGS=-std=gnu99
          maturin-version: v1.11.5
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then
              yum install -y perl-IPC-Cmd perl-Time-Piece
            fi
          args: --release --locked --compatibility pypi -i python3.12 --out dist --features extension-module

      - name: Verify wheel was produced
        shell: bash
        run: ls -lh aegis_rust_v2/dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-dist-${{ matrix.platform.target }}
          path: aegis_rust_v2/dist/

  # ── Create GitHub Release ────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [validate, build-python, build-rust]
    environment:
      name: release
    permissions:
      contents: write
      id-token: write   # for artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets/

      - name: Flatten artifact directories
        run: |
          python scripts/prepare_release_assets.py --input release-assets --output release

      - name: Attest build artifacts (SLSA Level 2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*.whl,release/*.tar.gz"

      - name: Extract CHANGELOG excerpt for this release
        id: changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/extract_release_notes.py --changelog CHANGELOG.md --version "${VERSION}" --output release_body.md

      - name: Create a new GitHub Release without an update path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python scripts/create_github_release.py --tag "${RELEASE_TAG}" --version "${VERSION}" --notes-file release_body.md --asset-directory release
