#
# release.yml — Full release pipeline triggered on "v*" tag pushes.
#
# Flow:
#   1. Build multi-platform Python wheels (manylinux, macOS, Windows)
#   2. Build Rust extension wheels for each platform via maturin
#   3. Generate SHA-256 hashes for all artifacts
#   4. Create GitHub Release with CHANGELOG excerpt and all artifacts
#   5. Attest artifacts with GitHub's artifact attestation (SLSA Level 2)
name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.4.0)"
        required: true

env:
  PYTHON_BUILD_VERSION: "3.12"
  CARGO_TERM_COLOR: always

jobs:
  # ── Validate the tag matches pyproject.toml version ─────────────────────
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: ver
        run: |
          VERSION=$(python -c "
          import re, sys
          txt = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*[\"\']([\d.]+)[\"\']', txt, re.M)
          if not m:
              sys.exit('version not found in pyproject.toml')
          print(m.group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

  # ── Pure-Python sdist + wheel (platform-independent) ────────────────────
  build-python:
    name: Build Python package
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_BUILD_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution
        run: twine check dist/*

      - name: Generate SHA-256 hashes
        run: |
          cd dist
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Rust extension wheels (deterministic cross-platform matrix) ─────────
  # One abi3 (cp311-abi3) wheel per platform target covers every supported
  # CPython >= 3.11, so there is no Python-version axis. PyO3/maturin-action
  # builds glibc wheels inside pinned manylinux2014 containers and musl wheels
  # inside musllinux_1_2 containers (reproducible toolchains), cross-compiling
  # aarch64/armv7 via the action's bundled cross/zig support. macOS and Windows
  # build natively on their respective hosted runners.
  #
  #   Linux  glibc  : x86_64, aarch64            (manylinux2014)
  #   Linux  musl   : x86_64, aarch64, armv7     (musllinux_1_2 — edge / OT / IL5)
  #   macOS         : x86_64 (Intel), arm64 (Apple Silicon)
  #   Windows       : x86_64 (MSVC)
  build-rust:
    name: Rust wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    needs: validate
    strategy:
      # Never let one target's failure cancel the others — every platform
      # must build independently for a complete release.
      fail-fast: false
      matrix:
        platform:
          # ── Linux glibc (manylinux2014) ──
          - { runner: ubuntu-22.04,  target: x86_64-unknown-linux-gnu,        manylinux: "2014" }
          - { runner: ubuntu-22.04,  target: aarch64-unknown-linux-gnu,       manylinux: "2014" }
          # ── Linux musl (static — air-gapped / edge / industrial) ──
          - { runner: ubuntu-22.04,  target: x86_64-unknown-linux-musl,       manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04,  target: aarch64-unknown-linux-musl,      manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04,  target: armv7-unknown-linux-musleabihf,  manylinux: musllinux_1_2 }
          # ── macOS (native) ──
          - { runner: macos-13,      target: x86_64-apple-darwin }
          - { runner: macos-14,      target: aarch64-apple-darwin }
          # ── Windows (native, MSVC) ──
          - { runner: windows-2022,  target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_BUILD_VERSION }}

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        env:
          # Allow building an abi3-py311 wheel against a newer interpreter.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          working-directory: aegis_rust_v2
          target: ${{ matrix.platform.target }}
          # `auto` is a no-op on macOS/Windows; the container image is only
          # consulted for the Linux targets above.
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist --features extension-module

      - name: Verify wheel was produced
        shell: bash
        run: ls -lh aegis_rust_v2/dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: rust-dist-${{ matrix.platform.target }}
          path: aegis_rust_v2/dist/

  # ── Create GitHub Release ────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [validate, build-python, build-rust]
    permissions:
      contents: write
      id-token: write   # for artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/

      - name: Flatten artifact directories
        run: |
          mkdir -p release/
          find release-assets/ -type f -not -name "*.sha256" \
            \( -name "*.whl" -o -name "*.tar.gz" \) \
            -exec cp {} release/ \;
          # Rehash everything in one place
          cd release/
          for f in *.whl *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      - name: Attest build artifacts (SLSA Level 2)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "release/*.whl,release/*.tar.gz"

      - name: Extract CHANGELOG excerpt for this release
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          python - <<'EOF'
          import re, os, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md").read()
          # Match "## [2.4.0]" or "## 2.4.0" sections
          pattern = rf"(?m)^##\s+[\[v]?{re.escape(version)}[^\n]*\n(.*?)(?=\n##\s|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          body = m.group(1).strip() if m else f"Release v{version}"
          # Write to file so the shell step can use it
          with open("release_body.md", "w") as f:
              f.write(body)
          print(f"Extracted {len(body)} chars for v{version}")
          EOF
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aegis Latent Core v${{ needs.validate.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, 'rc') || contains(needs.validate.outputs.version, 'b') || contains(needs.validate.outputs.version, 'a') }}
          files: |
            release/*.whl
            release/*.tar.gz
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
