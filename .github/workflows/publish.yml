#
# publish.yml — compatibility status check for local package construction only.
# Publication authority lives exclusively in the separately gated,
# tag-bound publish_pypi.yml workflow.
name: Validate Python package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit-pypi:
    name: submit-pypi
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned build tools
        run: pip install build==1.3.0 twine==6.2.0

      - name: Build source and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          python -c "import aegis; print('aegis', aegis.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
