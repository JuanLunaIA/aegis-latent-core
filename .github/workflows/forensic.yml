name: Forensic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  forensic:
    name: Forensic checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libsqlite3-dev python3-dev

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install stable

      - name: Install Python dev deps
        run: |
          python -m pip install -U pip
          pip install -e ".[storage-sqlite,dev]" || pip install -r requirements.txt || true

      - name: Build Rust extension (maturin)
        run: |
          python -m pip install maturin
          cd aegis_rust_v2
          maturin develop --release || true

      - name: Run static checks
        run: |
          ruff check . || true
          mypy aegis || true
          bandit -r aegis -x tests || true
          pip-audit --progress-spinner off || true

      - name: Run Python tests
        run: |
          pytest -q || true

      - name: Run forensic checks script
        run: |
          python tools/forensic/forensic_checks.py

      - name: Upload forensic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forensic-report
          path: |
            tools/forensic/report.json
            tools/visualizer/test_results.json
