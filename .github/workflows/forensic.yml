#
# forensic.yml — Forensic integrity and static analysis checks.
#
# Runs on main branch pushes, PRs targeting main, and on demand.
# Unlike ci.yml, this matrix includes Python 3.13 and exercises the full
# forensic tool chain (bandit, mypy, pip-audit, forensic_checks.py).
name: Forensic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full forensic sweep — Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  HERMES_SANDBOX: "true"

jobs:
  forensic:
    name: Forensic checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pip-audit
          pip install -e ".[storage-sqlite,dev]"

      - name: Build Rust extension
        working-directory: aegis_rust_v2
        run: |
          maturin build --release --features extension-module
          pip install --force-reinstall target/wheels/*.whl

      - name: Bandit SAST
        run: bandit -r aegis/ aegis_server/ -c pyproject.toml -lll

      - name: Mypy (core modules)
        run: |
          mypy --config-file=mypy-ci.ini \
            aegis/core/crypto_audit.py \
            aegis/core/mmr.py \
            aegis/proxy/waf.py

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run full test suite
        run: python -X faulthandler -m pytest -q --tb=short -o faulthandler_timeout=60

      - name: Run forensic checks script
        run: python tools/forensic/forensic_checks.py

      - name: Upload forensic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forensic-report-py${{ matrix.python-version }}
          path: |
            tools/forensic/report.json
          retention-days: 30
