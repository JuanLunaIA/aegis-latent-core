#
# publish_pypi_gateway.yml — publish the gateway distribution (`aegis-latent-core`,
# the root package: aegis + aegis_server + integrations) to PyPI.
#
# This is separate from publish_pypi.yml, which publishes the SDK distribution
# (`aegis-latent-sdk`, from sdk/python). Before this workflow, no workflow ever
# published `aegis-latent-core` to PyPI; release.yml's build-python job builds it
# only as a GitHub Release asset. docs/RELEASE_STATUS.md and AGENTS.md record that
# gap for every release through 5.0.1 — this closes it, starting with the next tag.
#
# Requires a PyPI Trusted Publisher configured for project `aegis-latent-core`
# against this repository, workflow file, and the `pypi-gateway` environment
# (separate from the SDK's `pypi` environment, because it is a different PyPI
# project). That is a PyPI-side, per-owner action this workflow cannot perform.
name: Publish gateway to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed release tag to publish"
        required: true
        type: string
      expected_target:
        description: "Full commit SHA signed by release_tag"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  EXPECTED_TAG_TARGET: ${{ inputs.expected_target }}

concurrency:
  group: publish-pypi-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify signed tag and protected-branch ancestry
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - name: Verify immutable release provenance
        run: |
          scripts/verify_release_tag.sh "${RELEASE_TAG}" "${EXPECTED_TAG_TARGET}"

  build:
    name: Build and verify the gateway package
    needs: provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_TAG_TARGET }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release tag matches gateway package version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib

          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([\d.]+)"', text, re.M)
          if not match:
              raise SystemExit("version not found in pyproject.toml")
          version = match.group(1)
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match gateway v{version}")
          PY
      - name: Install locked build backend
        run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Build and verify gateway distributions
        run: |
          python -m build
          twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Verify the wheel installs and imports cleanly
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "import aegis; print('aegis', aegis.__version__)"
      - name: Upload immutable gateway distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gateway-dist-${{ inputs.expected_target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified gateway artifact
    needs: build
    if: vars.AEGIS_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi-gateway
      url: https://pypi.org/project/aegis-latent-core/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact gateway artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gateway-dist-${{ inputs.expected_target }}
          path: release-artifact
      - name: Publish to PyPI with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifact
          print-hash: true
          verbose: true
          attestations: true
          skip-existing: false
