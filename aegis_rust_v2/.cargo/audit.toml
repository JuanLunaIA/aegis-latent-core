#
# cargo-audit advisory suppression — review before each pyo3/pqcrypto upgrade.

[advisories]
ignore = [
    # pyo3 0.24.x advisories RUSTSEC-2026-0176 / -0177 were cleared by the
    # upgrade to pyo3 0.29.0 (FromPyObject opt-in + GIL-API rename migration).
    # They are intentionally NOT ignored here so a regression would re-fail CI.

    # hickory-proto RUSTSEC-2026-0118 / -0119 were removed from this list on
    # 2026-09-24 (REG-D76): the locked hickory-proto 0.26.1 is unaffected by the
    # first (unaffected >= 0.26.0-beta.1) and patched for the second (>= 0.26.1),
    # and cargo-audit reports 0 vulnerabilities without them. They are NOT
    # ignored, so a regression to an affected version would fail CI.

    # paste macro crate — unmaintained upstream, no CVE; used transitively by pqcrypto.
    "RUSTSEC-2024-0436",

    # pqcrypto family — unmaintained upstream advisories; no replacement available yet.
    "RUSTSEC-2026-0162",  # pqcrypto-traits
    "RUSTSEC-2026-0163",  # pqcrypto-internals
    "RUSTSEC-2026-0166",  # pqcrypto-mldsa
]
