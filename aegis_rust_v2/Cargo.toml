[package]
name = "aegis_rust"
version = "4.3.0"
edition = "2021"
description = "Tier-4 Rust core: zero-copy forwarder, Aho-Corasick WAF, BLAKE3 audit chain, mmap WAL, lock-free rate limiter & session store, ML-DSA PQC signing"
license = "AGPL-3.0-only"
authors = ["Juan Luna <juan.c.luna04@gmail.com>"]

[features]
# Enable when building as a Python extension (.so/.pyd).
# maturin enables pyo3/extension-module explicitly via `[tool.maturin] features`
# in pyproject.toml, so it must NOT be a default feature here: a default
# extension-module would also apply to `cargo test`, which then omits the
# libpython link and fails with undefined Py* symbols. Keeping it out of
# `default` lets the test binary link libpython normally, while production
# wheels still get extension-module from maturin (and the CI
# `--features extension-module`).
# `pqclean-pqc` is on by default so an ordinary build is unchanged. It is a
# feature rather than a hard dependency so that `--no-default-features
# --features pure-rust-pqc,...` genuinely *drops* the archived PQClean C code
# and its three advisories, instead of adding a second implementation beside it.
default = ["pqclean-pqc"]
extension-module = ["pyo3/extension-module"]
embedded = []  # Strip non-essential components for edge/OT deployment
# Swap the ML-DSA-65 backend from PQClean (C, upstream archived) to the pure-Rust
# RustCrypto `ml-dsa` crate. Off by default and that is a measured decision, not
# caution: signing costs 4.8x more on the pure-Rust backend, and signing is
# per-commit work on the evidence path. See `src/pqc_trait.rs` for the numbers
# and for the byte-compatibility properties that make the swap safe at all.
pure-rust-pqc = ["dep:ml-dsa", "dep:rand_core", "dep:getrandom"]
pqclean-pqc = ["dep:pqcrypto-mldsa", "dep:pqcrypto-traits"]
full = ["extension-module"]  # All features
# Both backends compiled together. Not a deployment configuration -- it exists
# so the cross-backend byte-compatibility tests in `src/pqc_trait.rs` can run,
# which is the evidence that a swap does not strand existing signatures.
pqc-compat-tests = ["pqclean-pqc", "pure-rust-pqc"]

[lib]
name = "aegis_rust"
crate-type = ["cdylib", "rlib"]

[lints.rust]
# `kani` is set by the Kani model checker, not by cargo. Declaring it here keeps
# `cargo clippy -- -D warnings` from rejecting the `#[cfg(kani)]` proof module,
# while an actual typo in a cfg name is still caught.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# Python bindings
pyo3 = { version = "0.29", features = ["abi3-py311"] }

# Async runtime — powers connection-pooled HTTP forwarder
tokio = { version = "1", features = ["full"] }

# Async HTTP client with persistent connection pool (replaces reqwest::blocking).
# `hickory-dns` replaces the default getaddrinfo resolver (which runs on Tokio's
# blocking thread pool, spawning threads via clone() on demand) with a fully
# async resolver. This is REQUIRED for seccomp compatibility: it ensures the
# only OS threads are the fixed Tokio worker pool (warmed before the seccomp
# filter is applied), so clone()/clone3() can stay forbidden at steady state.
# `native-tls-vendored` keeps the native-tls backend (SChannel on Windows,
# Secure Transport on macOS, OpenSSL on Linux) — preserving TLS/mTLS client
# identity semantics — but statically links a from-source OpenSSL on Linux
# instead of dynamically linking the host's libssl/libcrypto. This is what
# makes the released wheels self-contained and cross-compilable for the full
# validated release matrix (x86_64 glibc; x86_64, aarch64, and armv7 musl;
# macOS and Windows). The aarch64 glibc wheel remains blocked by the upstream
# pqcrypto-internals cross-toolchain requirement documented in release CI.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "native-tls-vendored", "http2", "hickory-dns"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast multi-pattern WAF (SIMD Aho-Corasick — replaces Python re module)
aho-corasick = { version = "1", features = ["std"] }

# BLAKE3 hashing — ~4 GB/s SIMD vs ~350 MB/s SHA-256
blake3 = "1"

# Lock-free MPSC ring buffer for audit events
crossbeam-queue = "0.3"

# Sharded concurrent hash map — replaces OrderedDict + RLock
dashmap = "6"

# Memory-mapped WAL — replaces line-delimited JSON + os.fsync()
memmap2 = "0.9"

# CRC32 for WAL frame integrity
crc32fast = "1"

# Low-contention Mutex for mmap WAL writes
parking_lot = "0.12"

# Post-quantum signing (ML-DSA-65 / FIPS 204)
pqcrypto-mldsa = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

# Pure-Rust ML-DSA-65, behind `pure-rust-pqc`. Optional so the default build's
# dependency surface is unchanged: this is a migration shield for the archived
# PQClean upstream (RUSTSEC-2026-0166/-0162/-0163), not a second always-on
# implementation of the same primitive.
ml-dsa = { version = "0.1", optional = true }
rand_core = { version = "0.10", optional = true }
getrandom = { version = "0.4", optional = true }

# Legacy crypto (retained for backward compat + HMAC signing).
#
# The 0.11 digest line is what drops `block-buffer 0.10.4` from the tree: the
# 0.10 line pins it transitively through `digest 0.10`, and it is the buffer
# sitting under every SHA-256 and HMAC call on the evidence path. SHA-256 is
# defined by FIPS 180-4, not by a crate version, so the migration must be
# byte-identical; the FIPS 180-4 and RFC 4231 vector tests in `src/ledger.rs`
# and `tests/test_mmr_parity.py` are what hold that.
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# HTTP types for response construction
http = "1"

[dev-dependencies]
# Test-only, and deliberately the same version Cargo already resolves for the
# digest stack, so `tests/block_buffer_panic_safety.rs` exercises the buffer
# this crate actually links rather than a second copy. See that file for why
# a transitive dependency is worth a direct test.
block-buffer = "0.12"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "debuginfo"

[profile.release.build-override]
opt-level = 3
strip = true

[profile.embedded]
inherits = "release"
opt-level = "z"        # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true           # Strip all symbols for minimum size
overflow-checks = false  # Disable for size (safety still via seccomp)
