#
# docker-compose.enterprise.yml — Production-hardened, multi-vertical deployment.
#
# Vertical-specific notes are inline via comments.  Copy the relevant service
# block and override variables in your own .env.enterprise file.
#
# Usage:
#   cp .env.example .env.enterprise && $EDITOR .env.enterprise
#   docker compose -f docker-compose.enterprise.yml up -d
#
# Supported verticals (select via AEGIS_COMPLIANCE_PRESET):
#   finreg   — SEC Rule 17a-4 WORM audit trail, MiFID II, FFIEC
#   hipaa    — HIPAA §164.312(b) audit controls, 21 CFR Part 11
#   fedramp  — FedRAMP High / DoD IL5 air-gap compatible
#   judicial — Daubert-standard cryptographic admissibility, chain-of-custody
#   standard — SOC 2 Type II, ISO 27001, GDPR Art. 5(2) baseline

services:

  # ── Aegis Proxy ─────────────────────────────────────────────────────────────
  aegis:
    image: ghcr.io/juanlunaia/aegis-latent-core:4.1.2
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: always
    ports:
      # Bind to loopback only; front with nginx/haproxy for TLS termination.
      - "127.0.0.1:${AEGIS_PORT:-8080}:8080"
    volumes:
      - aegis-wal:/data                  # Persistent WAL — back up daily
      - aegis-certs:/certs:ro            # mTLS certificates (see certs service)
    environment:
      # ── Provider ──────────────────────────────────────────────────────────
      AEGIS_PROVIDER:              ${AEGIS_PROVIDER:-openai}
      AEGIS_BACKEND_URL:           ${AEGIS_BACKEND_URL:-https://api.openai.com}
      AEGIS_BACKEND_API_KEY:       ${AEGIS_BACKEND_API_KEY:?required}
      # ── Auth ──────────────────────────────────────────────────────────────
      AEGIS_API_KEYS:              ${AEGIS_API_KEYS:?required}
      AEGIS_AUDIT_API_KEYS:        ${AEGIS_AUDIT_API_KEYS:?required}
      # ── Cryptographic audit chain ──────────────────────────────────────
      AEGIS_SIGNING_KEY:           ${AEGIS_SIGNING_KEY:?required}  # 64-char hex; store in Vault
      AEGIS_WAL_PATH:              /data/aegis.wal.jsonl
      AEGIS_MAX_MEMORY_NODES:      ${AEGIS_MAX_MEMORY_NODES:-500000}
      # ── Rate limiting ────────────────────────────────────────────────────
      AEGIS_RATE_LIMIT_BACKEND:    redis
      AEGIS_REDIS_URL:             rediss://redis:6379/0   # TLS Redis
      AEGIS_RATE_LIMIT_THRESHOLD:  ${AEGIS_RATE_LIMIT_THRESHOLD:-120}
      AEGIS_RATE_LIMIT_BURST:      ${AEGIS_RATE_LIMIT_BURST:-20}
      # ── Detection thresholds ─────────────────────────────────────────────
      AEGIS_FORCE_LOGPROBS:        "true"
      AEGIS_KL_ALERT_THRESHOLD:    ${AEGIS_KL_ALERT_THRESHOLD:-2.0}
      AEGIS_JS_ALERT_THRESHOLD:    ${AEGIS_JS_ALERT_THRESHOLD:-0.5}
      # ── mTLS (enable for FedRAMP / DoD / Zero-Trust deployments) ─────────
      AEGIS_SSL_CERTFILE:          ${AEGIS_SSL_CERTFILE:-}
      AEGIS_SSL_KEYFILE:           ${AEGIS_SSL_KEYFILE:-}
      AEGIS_SSL_CA_CERTS:          ${AEGIS_SSL_CA_CERTS:-}
      # ── Compliance preset ────────────────────────────────────────────────
      AEGIS_COMPLIANCE_PRESET:     ${AEGIS_COMPLIANCE_PRESET:-standard}
      # ── Observability ────────────────────────────────────────────────────
      AEGIS_LOG_LEVEL:             ${AEGIS_LOG_LEVEL:-INFO}
      AEGIS_WEBHOOK_URL:           ${AEGIS_WEBHOOK_URL:-}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - aegis-internal
    # ── SEC Rule 17a-4 (FinReg vertical) ───────────────────────────────────
    # WORM labelling for audit artefacts; requires an object-storage volume
    # driver with WORM semantics (e.g. AWS S3 Object Lock, NetApp ONTAP).
    labels:
      com.aegis.compliance.preset:   "${AEGIS_COMPLIANCE_PRESET:-standard}"
      com.aegis.compliance.sec17a4:  "${ENABLE_SEC17A4_LABELS:-false}"
      com.aegis.compliance.hipaa:    "${ENABLE_HIPAA_LABELS:-false}"
      com.aegis.version:             "4.1.2"

  # ── Redis (distributed rate-limit + session store) ───────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD:?required}"
      - "--tls-port"
      - "6379"
      - "--port"
      - "0"                             # Disable plaintext port
      - "--tls-cert-file"
      - "/certs/redis.crt"
      - "--tls-key-file"
      - "/certs/redis.key"
      - "--tls-ca-cert-file"
      - "/certs/ca.crt"
      - "--tls-auth-clients"
      - "no"                            # Server-side TLS; mutual optional
      - "--save"
      - "60 1"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAX_MEMORY:-512mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis-data:/data
      - aegis-certs:/certs:ro
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-p"
        - "6379"
        - "--tls"
        - "--insecure"
        - "ping"
      interval: 5s
      timeout: 3s
      retries: 5
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - aegis-internal

  # ── Aegis Enterprise Server (compliance export & offline re-verify) ───────
  # Hosts /v1/enterprise/compliance/export and the ComplianceExporter.
  # Runs on port 8090 — keep internal, never externally reachable.
  aegis-server:
    image: ghcr.io/juanlunaia/aegis-latent-core:4.1.2
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: always
    command: >
      uvicorn aegis_server.main:app
      --host 0.0.0.0
      --port 8090
      --workers 1
      --loop uvloop
    ports:
      - "127.0.0.1:${AEGIS_SERVER_PORT:-8090}:8090"
    volumes:
      - aegis-wal:/data:ro              # Read-only view of the WAL
      - compliance-exports:/exports
    environment:
      AEGIS_WAL_PATH:        /data/aegis.wal.jsonl
      AEGIS_SIGNING_KEY:     ${AEGIS_SIGNING_KEY:?required}
      AEGIS_AUDIT_API_KEYS:  ${AEGIS_AUDIT_API_KEYS:?required}
      AEGIS_EXPORT_PATH:     /exports
      AEGIS_LOG_LEVEL:       ${AEGIS_LOG_LEVEL:-INFO}
      # SQLite storage backend (swap for postgres/dynamodb via AEGIS_STORAGE_BACKEND)
      AEGIS_STORAGE_BACKEND: ${AEGIS_STORAGE_BACKEND:-sqlite}
      DATABASE_URL:          ${DATABASE_URL:-sqlite+aiosqlite:///data/aegis_server.db}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - aegis-internal

  # ── Prometheus + Grafana (optional observability stack) ───────────────────
  # Remove this block if you already have an observability platform.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - aegis-internal
    profiles:
      - observability                   # docker compose --profile observability up

# ── Named volumes ────────────────────────────────────────────────────────────
# Production: replace local driver with an enterprise-grade volume driver:
#   FinReg:   WORM-capable (S3 Object Lock, NetApp SnapLock)
#   HIPAA:    Encrypted-at-rest (LUKS, cloud provider KMS)
#   FedRAMP:  FIPS 140-3 validated storage + audit log backup to GovCloud
volumes:
  aegis-wal:
    driver: local
    driver_opts:
      # Example: switch to an NFS or CIFS mount in production
      # type: nfs
      # device: ":/mnt/aegis-wal"
      # o: "addr=nas.internal,rw,nolock"
  redis-data:
    driver: local
  compliance-exports:
    driver: local
  prometheus-data:
    driver: local
  # Certificates volume — populate via cert-manager, Vault PKI, or manual copy
  aegis-certs:
    external: false
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  aegis-internal:
    driver: bridge
    internal: true        # No direct internet egress from internal containers
    ipam:
      config:
        - subnet: "172.29.0.0/24"
