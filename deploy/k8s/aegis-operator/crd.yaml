apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aegisproxies.aegis.io
spec:
  group: aegis.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["replicas", "upstreamProvider"]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 1
                upstreamProvider:
                  type: string
                  enum: ["openai", "anthropic", "gemini", "openrouter", "custom"]
                upstreamUrl:
                  type: string
                signingKeySecret:
                  type: string
                  description: "Name of Secret containing AEGIS_SIGNING_KEY"
                apiKeysSecret:
                  type: string
                  description: "Name of Secret containing AEGIS_API_KEYS"
                walStorageClass:
                  type: string
                  default: "standard"
                walSizeGi:
                  type: integer
                  default: 10
                authDisabled:
                  type: boolean
                  default: false
                debugMode:
                  type: boolean
                  default: false
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu: { type: string, default: "100m" }
                        memory: { type: string, default: "256Mi" }
                    limits:
                      type: object
                      properties:
                        cpu: { type: string, default: "2000m" }
                        memory: { type: string, default: "2Gi" }
                hpa:
                  type: object
                  properties:
                    enabled: { type: boolean, default: true }
                    minReplicas: { type: integer, default: 1 }
                    maxReplicas: { type: integer, default: 10 }
                    targetCpuPercent: { type: integer, default: 70 }
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Degraded", "Failed"]
                replicas: { type: integer }
                readyReplicas: { type: integer }
                walHeadHash: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string }
  scope: Namespaced
  names:
    plural: aegisproxies
    singular: aegisproxy
    kind: AegisProxy
    shortNames: ["ap"]
