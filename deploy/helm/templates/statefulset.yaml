{{- /*
StatefulSet, not Deployment. The JSONL WAL is the authoritative evidence
store and admits exactly one writer per path: two writers produce divergent
prev_hash relationships that the loader cannot reconstruct as one verified
chain. A Deployment over a single shared PVC gave every replica the same WAL
path. volumeClaimTemplates gives each replica its own claim and therefore its
own path, so replicas scale without forking the chain.

The in-process guard is the backstop, not the design: the ledger takes a POSIX
advisory lock on the WAL path, so a second writer fails closed at startup
rather than corrupting evidence. aegis.workers is pinned to "1" for the same
reason — AEGIS_WORKERS forks that many uvicorn processes inside one pod, all
of them sharing this pod's WAL path.
*/ -}}
{{- $haMode := .Values.ha.mode | default "single" -}}
{{- if and (eq $haMode "active_passive") (not .Values.ha.sharedClaim) -}}
{{- fail "ha.mode=active_passive needs ha.sharedClaim: a ReadWriteMany PVC every replica mounts (one chain, one WAL)" -}}
{{- end -}}
{{- if and (eq $haMode "active_passive") (not .Values.ha.chainId) -}}
{{- fail "ha.mode=active_passive needs ha.chainId: the one chain the replicas share" -}}
{{- end -}}
{{- if and (eq $haMode "active_active") (not .Values.ha.sequencerUrlSecret.name) -}}
{{- fail "ha.mode=active_active needs ha.sequencerUrlSecret (the postgresql:// global sequence DSN)" -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegis-latent-core.fullname" . }}
  labels:
    {{- include "aegis-latent-core.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aegis-latent-core.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if eq $haMode "active_passive" }}
  # A standby is never Ready by design, so an ordered rollout would wait on it
  # forever. The writer lease, not pod ordering, keeps two writers off the WAL.
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  {{- else }}
  # Ordered rollout: a replica's successor starts only once the predecessor is
  # Ready, so a stuck WAL never has two pods contending for one volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "aegis-latent-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis-latent-core.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aegis-latent-core.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # Service links inject <SERVICE>_PORT=tcp://ip:port for every Service in the
      # namespace. A Service named "aegis" (or "aegis-*") therefore sets AEGIS_PORT,
      # which AegisSettings (env_prefix AEGIS_) parses as the integer `port` and
      # crashes on. Configuration reaches the pod only through explicit env.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aegis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.gossip.enabled }}
            - name: gossip
              containerPort: {{ .Values.gossip.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- if ne $haMode "single" }}
            - name: AEGIS_HA_MODE
              value: {{ $haMode | quote }}
            - name: AEGIS_HA_CHAIN_ID
              {{- if .Values.ha.chainId }}
              value: {{ .Values.ha.chainId | quote }}
              {{- else }}
              # The pod name: stable across restarts under a StatefulSet, unique
              # per replica, and the thing this replica's WAL claim is keyed by.
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
              {{- end }}
            - name: AEGIS_HA_LEASE_TTL_SECONDS
              value: {{ .Values.ha.leaseTtlSeconds | quote }}
            - name: AEGIS_HA_STANDBY_POLL_SECONDS
              value: {{ .Values.ha.standbyPollSeconds | quote }}
            - name: AEGIS_HA_MAX_SEQUENCING_LAG_SECONDS
              value: {{ .Values.ha.maxSequencingLagSeconds | quote }}
            {{- with .Values.ha.sequencerUrlSecret }}
            {{- if .name }}
            - name: AEGIS_HA_SEQUENCER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.gossip.enabled }}
            - name: AEGIS_GOSSIP_ENABLED
              value: "true"
            # The ordinal is the replica id: stable across restarts, unique per
            # replica, and already the thing the WAL claim is keyed by. A vector
            # clock entry belongs to an identity, so an id that moved would
            # abandon everything recorded under the old one.
            - name: AEGIS_GOSSIP_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: AEGIS_GOSSIP_INTERVAL_SECONDS
              value: {{ .Values.gossip.intervalSeconds | quote }}
            # The inbound listener. Must equal the containerPort above and the
            # port the peer list is written against, or every peer's exchange
            # is refused by a replica that looks healthy from its own side.
            - name: AEGIS_GOSSIP_BIND_PORT
              value: {{ .Values.gossip.port | quote }}
            # All interfaces inside the pod: peers reach this through the
            # headless Service's per-pod DNS name, and what protects the
            # listener is the mandatory client certificate, not the bind
            # address. Narrow the reachable set with a NetworkPolicy.
            - name: AEGIS_GOSSIP_BIND_HOST
              value: "0.0.0.0"
            - name: AEGIS_GOSSIP_CERTIFICATE_AUTHORITY
              value: {{ printf "%s/ca.crt" .Values.gossip.tls.mountPath | quote }}
            - name: AEGIS_GOSSIP_CLIENT_CERTIFICATE
              value: {{ printf "%s/tls.crt" .Values.gossip.tls.mountPath | quote }}
            - name: AEGIS_GOSSIP_CLIENT_PRIVATE_KEY
              value: {{ printf "%s/tls.key" .Values.gossip.tls.mountPath | quote }}
            # This pod's own name, so it can remove itself from the list
            # below: Helm renders one manifest for every ordinal and cannot
            # know which one it is being rendered for.
            - name: AEGIS_GOSSIP_SELF_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Every replica, through the headless Service, with this pod
            # filtered out at startup. Rendered from replicaCount because
            # there is no discovery: a peer missing from this list is a
            # replica that never converges and reports nothing wrong.
            - name: AEGIS_GOSSIP_PEERS
              value: >-
                {{- $full := include "aegis-latent-core.fullname" . -}}
                {{- $svc := printf "%s-headless" $full -}}
                {{- $port := .Values.gossip.port -}}
                {{- $ns := .Release.Namespace -}}
                {{- $entries := list -}}
                {{- range $i := until (int .Values.replicaCount) -}}
                {{- $host := printf "%s-%d.%s.%s.svc.cluster.local" $full $i $svc $ns -}}
                {{- $entries = append $entries (printf "%s-%d=https://%s:%v" $full $i $host $port) -}}
                {{- end -}}
                {{ join "," $entries }}
            {{- end }}
            - name: AEGIS_BACKEND_URL
              value: {{ .Values.aegis.backendUrl | quote }}
            - name: AEGIS_SECURITY_ENFORCEMENT_MODE
              value: {{ .Values.aegis.securityEnforcementMode | quote }}
            - name: AEGIS_REQUIRE_DURABLE_EVIDENCE
              value: {{ .Values.aegis.requireDurableEvidence | quote }}
            - name: AEGIS_REQUIRE_LSM
              value: {{ .Values.aegis.requireLsm | quote }}
            - name: AEGIS_REQUIRE_SECCOMP
              value: {{ .Values.aegis.requireSeccomp | quote }}
            - name: AEGIS_MAX_REQUEST_BODY_BYTES
              value: {{ .Values.aegis.maxRequestBodyBytes | quote }}
            - name: AEGIS_ANALYSIS_QUEUE_SIZE
              value: {{ .Values.aegis.analysisQueueSize | quote }}
            - name: AEGIS_ANALYSIS_WORKER_COUNT
              value: {{ .Values.aegis.analysisWorkerCount | quote }}
            - name: AEGIS_ANALYSIS_SAMPLE_RATE
              value: {{ .Values.aegis.analysisSampleRate | quote }}
            - name: AEGIS_ANALYSIS_TIMEOUT_SECONDS
              value: {{ .Values.aegis.analysisTimeoutSeconds | quote }}
            - name: AEGIS_RATE_LIMIT_BACKEND
              value: {{ .Values.aegis.rateLimitBackend | quote }}
            {{- with .Values.aegis.redisPasswordSecret }}
            # Unprefixed so it cannot collide with an AegisSettings field; must precede
            # AEGIS_REDIS_URL, which references it as $(REDIS_PASSWORD).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            - name: AEGIS_REDIS_URL
              value: {{ .Values.aegis.redisUrl | quote }}
            - name: AEGIS_FORCE_LOGPROBS
              value: {{ .Values.aegis.forceLogprobs | quote }}
            - name: AEGIS_LOG_LEVEL
              value: {{ .Values.aegis.logLevel | quote }}
            - name: AEGIS_KL_ALERT_THRESHOLD
              value: {{ .Values.aegis.klAlertThreshold | quote }}
            - name: AEGIS_JS_ALERT_THRESHOLD
              value: {{ .Values.aegis.jsAlertThreshold | quote }}
            - name: AEGIS_ENTROPY_ALERT_THRESHOLD_BITS
              value: {{ .Values.aegis.entropyAlertThresholdBits | quote }}
            # Not read by any code path (AUD-35, still open); the alert sender reads AEGIS_SIEM_URL
            - name: AEGIS_WEBHOOK_URL
              value: {{ .Values.aegis.webhookUrl | quote }}
            - name: AEGIS_WORKERS
              value: {{ .Values.aegis.workers | quote }}
            - name: AEGIS_WAL_PATH
              value: {{ .Values.persistence.mountPath }}/aegis.wal.jsonl
            - name: AEGIS_PHI_DEIDENTIFY
              value: {{ .Values.aegis.phiDeidentify | quote }}
            - name: AEGIS_WAF_SESSION_WINDOW
              value: {{ .Values.aegis.wafSessionWindow | quote }}
            - name: AEGIS_WAF_SESSION_CUMULATIVE_THRESHOLD
              value: {{ .Values.aegis.wafSessionCumulativeThreshold | quote }}
            - name: AEGIS_WAF_SESSION_CRESCENDO_TURNS
              value: {{ .Values.aegis.wafSessionCrescendoTurns | quote }}
            {{- if .Values.aegis.existingSecret }}
            - name: AEGIS_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: AEGIS_BACKEND_API_KEY
                  optional: true
            - name: AEGIS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: AEGIS_API_KEYS
            - name: AEGIS_AUDIT_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: AEGIS_AUDIT_API_KEYS
                  optional: true
            - name: AEGIS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: {{ .Values.aegis.signingKeySecretKey }}
                  optional: true
            # Strict API-key mode refuses to start without both of these
            # (AegisSettings.validate_runtime_invariants).
            - name: AEGIS_AUTH_IDENTITY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: AEGIS_AUTH_IDENTITY_HMAC_KEY
                  optional: true
            - name: AEGIS_API_KEY_PRINCIPALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aegis.existingSecret }}
                  key: AEGIS_API_KEY_PRINCIPALS_JSON
                  optional: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: wal-data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if eq $haMode "active_passive" }}
        # One chain, one WAL: every replica mounts the same ReadWriteMany claim;
        # the writer lease decides which of them may open it.
        - name: wal-data
          persistentVolumeClaim:
            claimName: {{ .Values.ha.sharedClaim }}
        {{- else if not .Values.persistence.enabled }}
        # Evidence is lost on pod restart. Evaluation only — a governed
        # deployment must set persistence.enabled=true.
        - name: wal-data
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "aegis-latent-core.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (ne $haMode "active_passive") }}
  volumeClaimTemplates:
    - metadata:
        name: wal-data
        labels:
          {{- include "aegis-latent-core.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
