# Default values for aegis-latent-core Helm chart.
# Override with: helm install aegis . -f my-values.yaml

replicaCount: 2

# ── Service account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

image:
  repository: ghcr.io/juanlunia/aegis-latent-core
  pullPolicy: IfNotPresent
  tag: "3.0.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Aegis configuration ───────────────────────────────────────────────────────
aegis:
  # URL of the upstream LLM backend; validated as absolute HTTP(S) without userinfo.
  backendUrl: "https://api.openai.com"
  # Production runtime invariants; do not override for governed traffic.
  securityEnforcementMode: "strict"
  requireDurableEvidence: "true"
  requireLsm: "true"
  requireSeccomp: "true"
  maxRequestBodyBytes: "1048576"
  analysisQueueSize: "2048"
  analysisWorkerCount: "2"
  analysisSampleRate: "1.0"
  analysisTimeoutSeconds: "5.0"
  rateLimitBackend: "redis"
  redisUrl: "redis://redis:6379"
  # Reference to a Secret containing AEGIS_BACKEND_API_KEY and AEGIS_API_KEYS
  # Create with: kubectl create secret generic aegis-keys \
  #   --from-literal=AEGIS_BACKEND_API_KEY=sk-... \
  #   --from-literal=AEGIS_API_KEYS=sk-aegis-1,sk-aegis-2 \
  #   --from-literal=AEGIS_AUDIT_API_KEYS=sk-audit-1
  existingSecret: "aegis-keys"
  # Key within existingSecret holding AEGIS_SIGNING_KEY (HMAC-SHA256 audit signing)
  signingKeySecretKey: "AEGIS_SIGNING_KEY"
  forceLogprobs: "true"
  logLevel: "INFO"
  klAlertThreshold: "2.0"
  jsAlertThreshold: "0.5"
  entropyAlertThresholdBits: "1.0"
  webhookUrl: ""
  workers: "2"
  phiDeidentify: "false"
  wafSessionWindow: "10"
  wafSessionCumulativeThreshold: "2.0"
  wafSessionCrescendoTurns: "3"

# ── WAL persistence ───────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: ""          # "" = cluster default
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /data

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: aegis.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aegis-tls
      hosts:
        - aegis.example.com

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Security context ──────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ── Pod disruption budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Topology spread (multi-AZ HA) ─────────────────────────────────────────────
# Spread pods across availability zones and nodes so a single-zone or single-node
# failure cannot take the service offline.  Set to [] to disable.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

nodeSelector: {}
tolerations: []
affinity: {}

# ── Prometheus SLO burn-rate alerting ─────────────────────────────────────────
# Requires the Prometheus Operator (kube-prometheus-stack or standalone).
# Generates a PrometheusRule CRD with 8 alerts (4 windows × 2 SLOs).
prometheus:
  sloAlerting:
    enabled: false
    evaluationInterval: "30s"
    runbookBaseUrl: "https://github.com/JuanLunaIA/aegis-latent-core/blob/main/docs/runbooks"
    additionalLabels: {}

    # Availability SLO: 99.9% of requests return non-5xx status
    availability:
      sloTarget: 0.999
      errorBudgetFraction: 0.001   # 1 - sloTarget

    # Latency SLO: 99% of requests complete in < 500ms (end-to-end)
    latency:
      sloTarget: 0.990
      errorBudgetFraction: 0.010   # 1 - sloTarget
